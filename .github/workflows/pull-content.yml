name: Pull content from prod

on:
  workflow_dispatch:

concurrency:
  group: pull-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    name: SFTP-pull /content into repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Pull /content from prod
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          lftp -u "$SFTP_USER" --env-password "sftp://$SFTP_HOST" <<LFTP_SCRIPT
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 20
          set mirror:parallel-transfer-count 4
          mirror --delete --verbose --parallel=4 "$REMOTE_DIR/content" ./content
          bye
          LFTP_SCRIPT

      - name: Commit if content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "Sync content from prod [skip ci]"
          git push
