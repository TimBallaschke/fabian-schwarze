name: Deploy to one.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-one-com
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Sanity-check secrets are present
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          echo "HOST len:     ${#SFTP_HOST}"
          echo "USER len:     ${#SFTP_USER}"
          echo "PASS len:     ${#SFTP_PASS}"
          echo "REMOTE len:   ${#REMOTE_DIR}"
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASS" ] || [ -z "$REMOTE_DIR" ]; then
            echo "::error::One or more SFTP secrets are empty"
            exit 1
          fi

      - name: Deploy
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          lftp -u "$SFTP_USER" --env-password "sftp://$SFTP_HOST" <<LFTP_SCRIPT
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 20
          set mirror:parallel-transfer-count 4
          mirror --reverse --delete --verbose --parallel=4 \
            --exclude '^\.git/' \
            --exclude '^\.github/' \
            --exclude '\.DS_Store$' \
            --exclude '^\.editorconfig$' \
            --exclude '^\.gitignore$' \
            --exclude '^\.herd/' \
            --exclude '^\.vscode/' \
            --exclude '^\.idea/' \
            --exclude '^node_modules/' \
            --exclude '^composer\.json$' \
            --exclude '^composer\.lock$' \
            --exclude '^README\.md$' \
            --exclude '^site/accounts/' \
            --exclude '^site/sessions/' \
            --exclude '^site/cache/' \
            --exclude '^site/config/\.license$' \
            ./ "$REMOTE_DIR"
          bye
          LFTP_SCRIPT
