name: Push content to prod (one-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no changes written to prod)"
        type: boolean
        default: true

concurrency:
  group: push-content
  cancel-in-progress: false

jobs:
  push:
    name: SFTP-push /content to prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Push /content to prod
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "::notice::DRY RUN — no files will be written to prod"
          else
            DRY_FLAG=""
            echo "::warning::LIVE RUN — prod /content will be overwritten to match repo"
          fi

          lftp -u "$SFTP_USER" --env-password "sftp://$SFTP_HOST" <<LFTP_SCRIPT
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 20
          set mirror:parallel-transfer-count 4
          mirror --reverse --delete --verbose --parallel=4 $DRY_FLAG \
            ./content "$REMOTE_DIR/content"
          bye
          LFTP_SCRIPT
