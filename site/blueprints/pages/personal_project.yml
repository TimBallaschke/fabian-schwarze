title: Artwork


columns:
  - width: 1/1
    sections:
      projectTitle:
        type: fields
        fields:
          projectTitle:
            type: text
            label: Title
            required: true

  - width: 1/2
    sections:
      projectImages:
        type: fields
        fields:
          projectImages:
            type: structure
            label: Images
            fields:
              projectImage:
                type: files
                label: Image
                layout: cards
                ratio: 1/1
                multiple: false
                required: true

  - width: 1/2
    sections:
      projectInfo:
        type: fields
        fields:
          projectMonth:
            type: select
            label: Month
            required: true
            width: 1/2
            options:
              Jan: January
              Feb: February
              Mar: March
              Apr: April
              May: May
              Jun: June
              Jul: July
              Aug: August
              Sep: September
              Oct: October
              Nov: November
              Dec: December
          projectYear:
            type: select
            label: Year
            required: true
            width: 1/2
            options:
              2030: 2030
              2029: 2029
              2028: 2028
              2027: 2027
              2026: 2026
              2025: 2025
              2024: 2024
              2023: 2023
              2022: 2022
              2021: 2021
              2020: 2020
              2019: 2019
              2018: 2018
              2017: 2017
              2016: 2016
              2015: 2015
              2014: 2014
              2013: 2013
              2012: 2012
              2011: 2011
              2010: 2010
          subCategory:
            type: select
            label: Sub-category
            options:
              story: Story
              diary: Diary
          projectText:
            type: textarea
            label: Text
            required: false
            size: large
            buttons: false





